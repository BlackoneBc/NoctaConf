[plugins]
enabled = [
    "yuuto/arch-updater",
    "yuuto/calculator",
    "nocode-96/cmd-runner",
    "nightwatch75/file-search",
    "3ri4ng0ld/ip-monitor",
    "noctalia/bongocat",
    "noctalia/wallhaven"
]

[shell]
button_borders = false
card_borders = false
corner_radius_scale = 2.0
font_family = "Adwaita Mono"
input_borders = false
lang = "de"
panel_anchor_bar = "default"
password_style = "random"
polkit_agent = true
popup_borders = false
screen_time_enabled = true

    [shell.animation]
    speed = 1.1000000163912773

    [shell.keyboard_layout.custom_labels]
    "Deutsch de" = "de"

    [shell.launcher]
    pinned = [
        "firefox",
        "discord",
        "com.valvesoftware.Steam",
        "com.heroicgameslauncher.hgl",
        "org.gnome.Terminal",
        "org.gnome.Nautilus",
        "com.spotify.Client",
        "com.github.IsmaelMartinez.teams_for_linux",
        "com.rtosta.zapzap",
        "org.mozilla.thunderbird",
        "io.gitlab.adhami3310.Impression",
        "org.gnome.Showtime",
        "org.videolan.VLC",
        "org.prismlauncher.PrismLauncher",
        "org.gnome.TextEditor",
        "org.onlyoffice.desktopeditors",
        "org.gnome.Software",
        "io.missioncenter.MissionCenter",
        "librewolf",
        "com.brave.Browser"
    ]

    [shell.panel]
    floating_layer = "top"
    open_near_click_control_center = true

    [shell.screen_corners]
    enabled = true

    [shell.shadow]
    direction = "down_right"

[theme]
community_palette = "Catppuccin Mocha Mauve-Lavender"
source = "community"

    [theme.templates]
    builtin_ids = [ "labwc" ]

[wallpaper]
directory = "__HOME__/Dokumente/Wallpaper"
transition_duration = 2800
transition_on_startup = true

    [wallpaper.default]
    path = "__HOME__/Dokumente/Wallpaper/dark-waves.jpg"

    [wallpaper.last]
    path = "__HOME__/Dokumente/Wallpaper/dark-waves.jpg"

    [wallpaper.monitor.DP-1]
    fill_color = "primary"

    [wallpaper.monitor.HDMI-A-1]
    fill_color = "secondary"

[weather]
refresh_minutes = 5

[widget.audio_visualizer]
width = 75

[widget.bar]
type = "yuuto/calculator:bar"

[widget.cat]
audio_spectrum = true
type = "noctalia/bongocat:cat"

[widget.clock]
scale = 1.1500000000000001

[widget.launcher]
glyph = "asterisk"

[widget.media]
hide_when_no_media = true
max_length = 800

[widget.sysmon]
stat = "gpu_usage"

[widget.widget]
type = "yuuto/arch-updater:widget"
