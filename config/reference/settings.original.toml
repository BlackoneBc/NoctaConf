config_version = 14

[accessibility]
ui_scale = 1.1500000096857548

[audio]
enable_overdrive = true

[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    center = [ "audio_visualizer", "clock", "cat", "weather", "media" ]
    end = [
        "tray",
        "notifications",
        "clipboard",
        "widget",
        "bar",
        "volume",
        "keyboard_layout",
        "network",
        "bluetooth",
        "brightness",
        "battery",
        "wallpaper",
        "session"
    ]
    margin_ends = 0
    padding = 10
    scale = 1.1000000089406967
    start = [ "launcher", "cpu", "sysmon", "ram", "taskbar", "screenshot" ]
    thickness = 40
    widget_spacing = 9

        [bar.default.dead_zone.actions]
        left = "panel-toggle launcher"
        middle = "settings-toggle"

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 10

[brightness]
minimum_brightness = 0.99999997764825821
sync_all_monitors = true

